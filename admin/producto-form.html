<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComMangaVerse - Formulario de producto</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="admin-layout">

        <!-- ===== MENÚ LATERAL ===== -->
        <aside class="admin-menu">
            <div class="admin-logo">
                <img src="../img/logo.png" alt="Logo de ComMangaVerse">
                <span>ComMangaVerse<br><small>Panel admin</small></span>
            </div>
            <nav>
                <a href="index.html" class="activo"> Inicio</a>
                <a href="productos.html"> Productos</a>
                <a href="usuarios.html"> Usuarios</a>
                <a href="../index.html">↩ Volver a la tienda</a>
            </nav>
        </aside>

        <!-- ===== CONTENIDO ===== -->
        <main class="admin-contenido">
            <a href="productos.html">← Volver al listado</a>
            <h2 id="titulo-formulario">Nuevo producto</h2>

            <section class="contenedor-formulario">
                <form id="form-producto" class="formulario" novalidate>

                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" placeholder="Ej: COM-005">
                    <small class="error" id="error-codigo"></small>

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre del cómic o manga">
                    <small class="error" id="error-nombre"></small>

                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" rows="4" placeholder="Describe el producto..."></textarea>
                    <small class="error" id="error-descripcion"></small>

                    <label for="precio">Precio</label>
                    <input type="number" id="precio" min="0" step="0.01" placeholder="Ej: 12990">
                    <small class="error" id="error-precio"></small>

                    <label for="stock">Stock</label>
                    <input type="number" id="stock" min="0" step="1" placeholder="Cantidad disponible">
                    <small class="error" id="error-stock"></small>

                    <label for="stock-critico">Stock crítico (opcional)</label>
                    <input type="number" id="stock-critico" min="0" step="1"
                        placeholder="Avisar cuando quede esta cantidad">
                    <small class="error" id="error-stock-critico"></small>

                    <!-- Alerta de stock crítico -->
                    <p class="aviso-stock" id="aviso-stock"></p>

                    <label for="categoria">Categoría</label>
                    <select id="categoria">
                        <option value="">Selecciona una categoría</option>
                        <option value="Superhéroes">Superhéroes</option>
                        <option value="Manga">Manga</option>
                        <option value="Independientes">Independientes</option>
                        <option value="Coleccionables">Coleccionables</option>
                    </select>
                    <small class="error" id="error-categoria"></small>

                    <label for="imagen">Ruta de la imagen (opcional)</label>
                    <input type="text" id="imagen" placeholder="Ej: img/nuevo-comic.jpg">
                    <small class="error" id="error-imagen"></small>

                    <button type="submit" class="boton-anadir" id="boton-guardar">Crear producto</button>
                </form>
            </section>
        </main>

    </div>

    <script src="../js/productos.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
