<!DOCTYPE html>
<html lang="es">

<head> <!-- el head para poder el titulo en la pestaña del navegador -->
    <meta charset="UTF-8">
    <title>Registro</title>
    <link href="https://fonts.google.com/specimen/Bebas+Neue?preview.script=Latn" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css"> <!-- link para poder agregar estilos a la pagina -->
</head>

<body> <!-- esto es el cuerpo de la pagina donde puedes agregar todo el contenido -->

    <header> <!-- esto es el encabezado para la tienda La comics -->
        <!-- logo + nombre de la tienda -->
        <div class="logo">
            <img src="img/logo.png" alt="Logo de ComMangaVerse">
            <h1>ComMangaVerse</h1>
        </div>

        <!-- menú principal de navegación -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <!-- sesión y carrito -->
        <div class="acciones-usuario">
            <a href="login.html" class="boton boton-sesion">Iniciar sesión</a>
            <a href="registro.html" class="boton boton-sesion">Registrarse</a>
            <a href="carrito.html" class="boton carrito">
                Carrito (<span id="contador-carrito">0</span>)
            </a>
        </div>
    </header>

    <main> <!-- contenido principal -->
        <section class="contenedor-formulario">
            <h2>Crear cuenta</h2>

            <form id="form-registro" class="formulario" novalidate>

                <label for="run">RUN</label>
                <input type="text" id="run" placeholder="Sin puntos ni guion. Ej: 123456785">
                <small class="error" id="error-run"></small>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
                <small class="error" id="error-nombre"></small>

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Tus apellidos">
                <small class="error" id="error-apellidos"></small>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@duoc.cl">
                <small class="error" id="error-correo"></small>

                <label for="fecha">Fecha de nacimiento (opcional)</label>
                <input type="date" id="fecha">
                <small class="error" id="error-fecha"></small>

                <label for="region">Región</label>
                <select id="region">
                    <option value="">Selecciona una región</option>
                </select>
                <small class="error" id="error-region"></small>

                <label for="comuna">Comuna</label>
                <select id="comuna" disabled>
                    <option value="">Primero selecciona una región</option>
                </select>
                <small class="error" id="error-comuna"></small>

                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" placeholder="Calle, número, depto.">
                <small class="error" id="error-direccion"></small>

                <button type="submit" class="boton-anadir">Registrarme</button>
                <p class="mensaje-exito" id="mensaje-exito"></p>
            </form>

            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 ComManga Verse</p>
    </footer>

    <script src="js/productos.js"></script> <!-- script para poder agregar los productos a la pagina -->
    <script src="js/carrito.js"></script> <!-- script para poder gestionar el carrito de compras -->
    <script src="js/regiones.js"></script>
    <!-- script para poder agregar las regiones y comunas al formulario de registro -->
    <script src="js/validaciones.js"></script> <!-- script para poder validar los datos del formulario de login -->

</body>

</html>
