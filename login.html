<!DOCTYPE html>
<html lang="es">

<head> <!-- el head para poder el titulo en la pestaña del navegador -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.google.com/specimen/Bebas+Neue?preview.script=Latn" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css"> <!-- link para poder agregar estilos a la pagina -->
</head>

<body> <!-- esto es el cuerpo de la pagina donde puedes agregar todo el contenido -->

    <header> <!-- esto es el encabezado para la tienda La comics -->
        <!-- logo + nombre de la tienda -->
        <div class="logo">
            <img src="img/logo.png" alt="Logo de ComMangaVerse">
            <h1>ComMangaVerse</h1>
        </div>

        <!-- menú principal de navegación -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <!-- sesión y carrito -->
        <div class="acciones-usuario">
            <a href="login.html" class="boton boton-sesion">Iniciar sesión</a>
            <a href="registro.html" class="boton boton-sesion">Registrarse</a>
            <a href="carrito.html" class="boton carrito">
                Carrito (<span id="contador-carrito">0</span>)
            </a>
        </div>
    </header>

    <main> <!-- contenido principal -->
        <section class="contenedor-formulario">
            <h2>Iniciar sesión</h2>

            <form id="form-login" class="formulario" novalidate>

                <!-- Campo: correo -->
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@duoc.cl">
                <small class="error" id="error-correo"></small>

                <!-- Campo: contraseña -->
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Entre 4 y 10 caracteres">
                <small class="error" id="error-contrasena"></small>

                <button type="submit" class="boton-anadir">Ingresar</button>

                <!-- Mensaje de éxito -->
                <p class="mensaje-exito" id="mensaje-exito"></p>
            </form>

            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 ComManga Verse</p>
    </footer>

    <script src="js/productos.js"></script> <!-- script para poder agregar los productos a la pagina -->
    <script src="js/carrito.js"></script> <!-- script para poder gestionar el carrito de compras -->
    <script src="js/validaciones.js"></script> <!-- script para poder validar los datos del formulario de login -->

</body>

</html>
